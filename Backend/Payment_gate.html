<!-- Payment_gate.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UPI Payment</title>

  <link rel="stylesheet" href="style/Payment_gate.css">
</head>

<body>

  <div class="payment-box">

    <h2>Make Payment</h2>

    <div class="instruction">
      Scan the QR code below using any UPI app.
    </div>


    <!-- =========================
         RECEIVER INFORMATION
         ========================= -->

    <div class="receiver">

      <div class="receiver-label">
        Amount will be received by
      </div>

      <div class="receiver-name">
        DOT
      </div>

      <div class="upi-id">
        UPI ID: dot@upi
      </div>

    </div>


    <!-- =========================
         PAYMENT AMOUNT
         ========================= -->

    <div class="amount" id="ticketAmt">
      ₹1,000
    </div>


    <!-- =========================
         QR CODE AREA
         ========================= -->

    <div class="qr-section">

      <div class="qr-title">
        Scan & Pay
      </div>

      <div class="qr-box">

                <!--
          PUT YOUR QR CODE HERE

          Replace "upi-qr.png"
          with your QR image filename.

          Example:
          images/my-qr.png
        -->

        <div id="qrcode"></div>


<!--        <img id="qrcode"-->
<!--          src="upi-qr.png"-->
<!--          alt="UPI Payment QR Code"-->
<!--        >-->

      </div>

      <div class="qr-help">
        Open Google Pay, PhonePe, Paytm or another UPI app
        and scan this QR code.
      </div>

    </div>


    <!-- =========================
         UTR / REF ID
         ========================= -->

    <form id="paymentForm">

      <div class="field">

        <label for="utr">
          UTR / Ref ID (12 Digit)
        </label>

        <input
          type="text"
          id="utr"
          name="utr"
          placeholder="Enter 12 digit UTR / Ref ID"
          maxlength="12"
          inputmode="numeric"
          autocomplete="off"
          required
        >

        <div class="help">
          Enter exactly 12 digits.
        </div>

      </div>


      <!-- Disabled until exactly 12 digits -->
      <!-- Submit button (glass style). Keeps id="submitBtn", type="submit"
           and the disabled attribute so Payment_gate.js works unchanged. -->
      <div class="sb">
        <div class="sb-stage">

          <div class="sb-fx">
            <button type="submit" id="submitBtn" class="sb-btn" aria-label="Submit Payment" disabled>
              <span class="sb-orb"></span>
              <span class="sb-orb2" style="--bg: #bef2; --scale: 0.6; --x1: 40px; --x2: -55%; --rot: -1;"></span>
              <span class="sb-orb2" style="--bg: #aef3; --scale: 0.25; --x1: 50px; --x2: 130px; --rot: -0.5;"></span>
              <span class="sb-orb2" style="--bg: #ddf3; --scale: 0.2; --x1: 70px; --x2: -55%; --rot: -1.1;"></span>
              <span class="sb-orb2" style="--bg: #bef2; --scale: 0.35; --x1: 40px; --x2: 90px; --rot: 1.5;"></span>
            </button>
          </div>

          <div class="sb-text" aria-hidden="true">
      <span class="sb-letter sb-a" style="animation-delay:0.0s;">S</span>
      <span class="sb-letter sb-a" style="animation-delay:0.025s;">u</span>
      <span class="sb-letter sb-a" style="animation-delay:0.05s;">b</span>
      <span class="sb-letter sb-a" style="animation-delay:0.075s;">m</span>
      <span class="sb-letter sb-a" style="animation-delay:0.1s;">i</span>
      <span class="sb-letter sb-a" style="animation-delay:0.125s;">t</span>
      <span class="sb-letter sb-a" style="animation-delay:0.15s;">&nbsp;</span>
      <span class="sb-letter sb-a" style="animation-delay:0.175s;">P</span>
      <span class="sb-letter sb-a" style="animation-delay:0.2s;">a</span>
      <span class="sb-letter sb-a" style="animation-delay:0.225s;">y</span>
      <span class="sb-letter sb-a" style="animation-delay:0.25s;">m</span>
      <span class="sb-letter sb-a" style="animation-delay:0.275s;">e</span>
      <span class="sb-letter sb-a" style="animation-delay:0.3s;">n</span>
      <span class="sb-letter sb-a" style="animation-delay:0.325s;">t</span>

      <span class="sb-letter sb-b" style="animation-delay:0.0s;">S</span>
      <span class="sb-letter sb-b" style="animation-delay:0.025s;">u</span>
      <span class="sb-letter sb-b" style="animation-delay:0.05s;">b</span>
      <span class="sb-letter sb-b" style="animation-delay:0.075s;">m</span>
      <span class="sb-letter sb-b" style="animation-delay:0.1s;">i</span>
      <span class="sb-letter sb-b" style="animation-delay:0.125s;">t</span>
      <span class="sb-letter sb-b" style="animation-delay:0.15s;">t</span>
      <span class="sb-letter sb-b" style="animation-delay:0.175s;">e</span>
      <span class="sb-letter sb-b" style="animation-delay:0.2s;">d</span>
          </div>

          <div class="sb-icon" aria-hidden="true">
            <svg class="sb-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"></path>
            </svg>
            <svg class="sb-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"></path>
            </svg>
            <svg class="sb-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"></path>
            </svg>
          </div>

        </div>
      </div>

      <button
        type="button"
        id="downloadBtn"
        disabled
      >
        Download Receipt
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

  </div>

  <!-- Resets the button's "Submitted" look if the user edits the UTR or an error is shown.
       Purely visual; does not touch your payment logic. -->
  <script>
    (function () {
      var btn = document.getElementById("submitBtn");
      var utr = document.getElementById("utr");
      var msg = document.getElementById("message");
      if (!btn) return;
      if (utr) utr.addEventListener("input", function () { btn.blur(); });
      if (msg && window.MutationObserver) {
        new MutationObserver(function () {
          if (msg.classList.contains("error")) btn.blur();
        }).observe(msg, { attributes: true, attributeFilter: ["class"] });
      }
    })();
  </script>

  <script src="script/qrcode.min.js"></script>
  <script type="module" src="script/Payment_gate.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--<script src="https://unpkg.com/@supabase/supabase-js@2"></script>-->

<!--<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>-->
<!--<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>-->




</body>
</html>
