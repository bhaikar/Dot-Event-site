<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Registration</title>
    <link rel="stylesheet" href="style/Index.css">

</head>

<body>

    <nav class="navbar">
        <div class="logo">Team Registration</div>
        <div class="nav-text">Register your team</div>
    </nav>

    <section class="hero">
        <h1>Register Your Team</h1>
        <p>Fill in the details below to complete your team registration.</p>
    </section>

    <div class="form-container">

        <form class="form-body" id="teamForm">

            <div class="section-title">Team Details</div>

            <div class="field">
                <label for="teamName">Team Name</label>
                <input type="text" id="teamName" placeholder="Enter team name" required>
            </div>

            <div class="field">
                <label for="leaderName">Team Leader</label>
                <input type="text" id="leaderName" placeholder="Enter leader name" required>
            </div>

            <div class="field">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}"
                    maxlength="10" required>
            </div>

            <div class="field">
                <label for="whatsapp">WhatsApp Number</label>
                <input type="tel" id="whatsapp" placeholder="Enter 10-digit WhatsApp number" pattern="[0-9]{10}"
                    maxlength="10" required>
            </div>

            <div class="members-header">
                <h2>Team Members</h2>

                <button type="button" id="addMember">
                    + Add Member
                </button>
            </div>

            <div id="members">

                <div class="member">
                    <label>Member 2 Name</label>

                    <input type="text" name="member" placeholder="Enter member 2 name" required>
                </div>

            </div>

            <div class="ticket-section">

                <div class="field">
                    <label for="ticket">Select Ticket</label>

                    <select id="ticket" required>
                        <option value="">Choose a ticket</option>
                        <option value="Hackathon">Hackathon</option>
                        <option value="Gameathon">Gameathon</option>
                        <option value="Cicada">Cicada</option>
                    </select>
                </div>

                <div class="agreement">
                    <label>
                        <input type="checkbox" id="terms" name="terms" required>

                        <span>
                            I have read and agree to the
                            <strong>Terms & Conditions</strong>.
                        </span>
                    </label>
                </div>


                <button type="submit" class="submit-btn">
                    Complete Registration
                </button>

                <div class="message" id="message">
                    Team registration submitted successfully!
                </div>

            </div>

        </form>

    </div>

    <div class="footer">
        © 2026 Team Registration. All rights reserved.
    </div>

    <script type="module" src="script/Index.js"></script>

</body>

</html>
